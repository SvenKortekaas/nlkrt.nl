name: Deploy to Cloud86

on:
  push:
    branches: [main]
  workflow_dispatch:   # handmatig kunnen triggeren via GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Minify HTML
        run: npx --yes html-minifier-terser --collapse-whitespace --remove-comments index.html -o index.html

      - name: Inject CSP hashes into .htaccess
        run: |
          python3 - <<'EOF'
          import hashlib, base64, re

          html = open('index.html', encoding='utf-8').read()

          style_content = re.search(r'<style>(.*?)</style>', html, re.DOTALL).group(1)
          style_hash = base64.b64encode(hashlib.sha256(style_content.encode()).digest()).decode()

          script_content = re.search(r'<script>(.*?)</script>', html, re.DOTALL).group(1)
          script_hash = base64.b64encode(hashlib.sha256(script_content.encode()).digest()).decode()

          htaccess = open('.htaccess', encoding='utf-8').read()
          htaccess = htaccess.replace('%%STYLE_HASH%%', style_hash)
          htaccess = htaccess.replace('%%SCRIPT_HASH%%', script_hash)
          open('.htaccess', 'w', encoding='utf-8').write(htaccess)

          print(f"style-hash:  sha256-{style_hash}")
          print(f"script-hash: sha256-{script_hash}")
          EOF

      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          port: ${{ secrets.SFTP_PORT }}
          protocol: ftps              # bij Cloud86: ftps (FTP over TLS)
          server-dir: ./
          local-dir: ./
          dangerous-clean-slate: false   # bestaande files niet wissen
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/SETUP.md
            **/.gitignore
            **/README.md
            **/CLAUDE.md